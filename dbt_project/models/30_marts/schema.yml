version: 2

models:
  - name: mart__orders_per_customer
    description: "Aggregation der Bestellungen pro Kunde und Jahr. Zeigt die Anzahl der Bestellungen je Kunde, Segment und Jahr."
    columns:
      - name: customer_id
        description: "Kunden-ID"
      - name: customer_name
        description: "Kundenname"
      - name: market_segment
        description: "Marktsegment"
      - name: order_year
        description: "Bestelljahr"
      - name: total_orders
        description: "Gesamtanzahl der Bestellungen"

  - name: mart__customer_per_country
    description: "Anzahl der Kunden pro Land und Region."
    columns:
      - name: nation
        description: "Land"
      - name: region
        description: "Region"
      - name: customer_count
        description: "Anzahl der Kunden"

  - name: mart__shipping_performance_monthly
    description: "Monatliche Versandperformance: Verspätungsrate, durchschnittliche Versanddauer und Umsatz."
    columns:
      - name: ship_month
        description: "Versandmonat"
      - name: total_lines
        description: "Gesamtanzahl der Bestellpositionen"
      - name: late_lines
        description: "Anzahl verspäteter Positionen"
      - name: late_line_rate_pct
        description: "Verspätungsrate in Prozent"
      - name: avg_days_to_ship
        description: "Durchschnittliche Tage bis zum Versand"
      - name: revenue_net
        description: "Netto-Umsatz"

  - name: mart__top_customers
    description: "Top-Kunden nach Umsatz mit geografischem Kontext."
    columns:
      - name: customer_id
        description: "Kunden-ID"
      - name: customer_name
        description: "Kundenname"
      - name: market_segment
        description: "Marktsegment"
      - name: nation
        description: "Land"
      - name: region
        description: "Region"
      - name: total_orders
        description: "Gesamtanzahl der Bestellungen"
      - name: total_revenue
        description: "Gesamtumsatz"
      - name: avg_order_value
        description: "Durchschnittlicher Bestellwert"
