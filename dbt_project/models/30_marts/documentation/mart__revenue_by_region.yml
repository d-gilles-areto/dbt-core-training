models:
  - name: mart__revenue_by_region
    description: "Umsatz, Bestellanzahl und durchschnittlicher Bestellwert nach Welthandelsregion."
    config:
      tags:
        - "tpch"

    columns:
      - name: region
        description: "Welthandelsregion (z.B. EUROPE, ASIA, AMERICA)"
        data_tests:
          - not_null

      - name: total_orders
        description: "Gesamtanzahl der Bestellungen in der Region"

      - name: total_revenue
        description: "Gesamtumsatz (netto) der Region"

      - name: avg_order_value
        description: "Durchschnittlicher Bestellwert in der Region"
