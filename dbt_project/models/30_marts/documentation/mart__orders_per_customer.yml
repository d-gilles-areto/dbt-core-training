models:
  - name: mart__orders_per_customer
    description: "Aggregation der Bestellungen pro Kunde. Zeigt die Anzahl der Bestellungen je Kunde und Segment."

    columns:
      - name: customer_id
        description: "Kunden-ID"

      - name: customer_name
        description: "Kundenname"

      - name: market_segment
        description: "Marktsegment"


      - name: total_orders
        description: "Gesamtanzahl der Bestellungen"