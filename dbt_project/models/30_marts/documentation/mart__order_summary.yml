models:
  - name: mart__order_summary
    description: "Übersicht aller Bestellungen mit Kunden- und Geo-Kontext. Pro Bestellung eine Zeile."
    config:
      tags:
        - "tpch"

    columns:
      - name: order_id
        description: '{{ doc("order_id") }}'
        data_tests:
          - not_null

      - name: customer_name
        description: '{{ doc("customer_name") }}'
        config:
          tags:
            - "pii"

      - name: market_segment
        description: "Marktsegment des Kunden"

      - name: nation
        description: '{{ doc("nation") }}'

      - name: region
        description: '{{ doc("region") }}'

      - name: order_date
        description: "Bestelldatum"

      - name: order_status
        description: "Status der Bestellung"

      - name: line_count
        description: "Anzahl der Positionen in der Bestellung"
        data_tests:
          - not_negative

      - name: total_net_amount
        description: "Gesamter Nettobetrag der Bestellung"
        data_tests:
          - not_negative

      - name: has_late_shipment
        description: "True, wenn mindestens eine Position verspätet versendet wurde"
