models:
  - name: mart__top_customers
    description: "Top-Kunden nach Umsatz mit geografischem Kontext."
    config:
      tags:
        - "tpch"

    columns:
      - name: customer_id
        description: "Kunden-ID"
        config:
          tags:
            - "pii"
        data_tests:
          - not_null

      - name: customer_name
        description: "Kundenname"
        config:
          tags:
            - "pii"

      - name: market_segment
        description: "Marktsegment"

      - name: total_orders
        description: "Gesamtanzahl der Bestellungen"
        data_tests:
          - not_negative

      - name: total_revenue
        description: "Gesamtumsatz"
        data_tests:
          - not_negative

      - name: avg_order_value
        description: "Durchschnittlicher Bestellwert"