models:
  - name: stg__orders
    description: "Staging-View für TPCH Orders. Präfixe entfernt."
    config:
      tags:
        - "tpch"

    columns:
      - name: orderkey
        description: '{{ doc("order_id") }}'
        data_tests:
          - unique
          - not_null

      - name: custkey
        description: '{{ doc("customer_id") }}'
        config:
          tags:
            - "pii"

      - name: orderdate
        description: '{{ doc("order_date") }}'

      - name: orderstatus
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']

      - name: orderpriority
        description: '{{ doc("order_priority") }}'

      - name: shippriority
        description: "Versandpriorität"

      - name: clerk
        description: "Sachbearbeiter"

      - name: comment
        description: "Kommentar"