models:
  - name: stg__nation
    description: "Staging-View für TPCH Nation. Präfixe entfernt."
    config:
      tags:
        - "tpch"

    columns:
      - name: nationkey
        description: "Primärschlüssel der Nation"
        data_tests:
          - unique
          - not_null

      - name: name
        description: '{{ doc("nation") }}'

      - name: regionkey
        description: '{{ doc("region_id") }}'

      - name: comment
        description: "Kommentar"