models:
  - name: stg__customer
    description: '{{ doc("stg__customer__model") }}'
    config:
      tags:
        - "tpch"

    columns:
      - name: custkey
        description: '{{ doc("customer_id") }}'
        data_tests:
          - unique
          - not_null
        config:
          tags:
            - "pii"

      - name: name
        description: "Name des Kunden"
        config:
          tags:
            - "pii"

      - name: mktsegment
        description: "Marktsegment des Kunden (z.B. AUTOMOBILE, BUILDING)"

      - name: nationkey
        description: "Fremdschlüssel zur Nation"

      - name: address
        description: "Adresse des Kunden"
        config:
          tags:
            - "pii"

      - name: phone
        description: "Telefonnummer des Kunden"
        config:
          tags:
            - "pii"

      - name: acctbal
        description: "Kontostand des Kunden"

      - name: comment
        description: "Kommentar"