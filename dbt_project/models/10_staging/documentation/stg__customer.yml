models:
  - name: stg__customer
    description: '{{ doc("stg__customer__model") }}'
    config:
      tags:
        - "tpch"

    columns:
      - name: custkey
        description: '{{ doc("customer_id") }}'
        data_tests:
          - unique
          - not_null
        config:
          tags:
            - "pii"

      - name: name
        description: '{{ doc("customer_name") }}'
        config:
          tags:
            - "pii"

      - name: mktsegment
        description: '{{ doc("market_segment") }}'

      - name: nationkey
        description: '{{ doc("nation_id") }}'

      - name: address
        description: '{{ doc("address") }}'
        config:
          tags:
            - "pii"

      - name: phone
        description: '{{ doc("phone") }}'
        config:
          tags:
            - "pii"

      - name: acctbal
        description: "Kontostand des Kunden"

      - name: comment
        description: '{{ doc("comment") }}'