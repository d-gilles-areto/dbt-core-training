version: 2

models:
  - name: dim__customer
    description: "Kundendimension mit geografischem Kontext (Nation, Region)."
    columns:
      - name: customer_id
        description: "Primärschlüssel des Kunden"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Vollständiger Kundenname"
      - name: address
        description: "Adresse des Kunden"
      - name: phone
        description: "Telefonnummer"
      - name: account_balance
        description: "Kontostand"
      - name: market_segment
        description: "Marktsegment (AUTOMOBILE, BUILDING, etc.)"
      - name: customer_comment
        description: "Kommentar zum Kunden"
      - name: nation_id
        description: "Fremdschlüssel zur Nation (nationkey)"
      - name: nation
        description: "Land des Kunden (aus dim__geo)"
      - name: region
        description: "Region des Kunden (aus dim__geo)"

  - name: dim__geo
    description: "Konforme Geografie-Dimension: Nation + Region konsolidiert."
    columns:
      - name: nationkey
        description: "Primärschlüssel der Nation"
        tests:
          - unique
          - not_null
      - name: nation
        description: "Name des Landes"
      - name: region
        description: "Name der Region"

  - name: fact__orders
    description: "Fakten-Tabelle auf Order-Grain. Enthält aggregierte Kennzahlen aus Order Lines. Materialisiert als Incremental (Merge)."
    columns:
      - name: orderkey
        description: "Primärschlüssel der Bestellung"
        tests:
          - unique
          - not_null
      - name: custkey
        description: "Fremdschlüssel zum Kunden"
        tests:
          - relationships:
              arguments:
                to: ref('dim__customer')
                field: customer_id
      - name: orderdate
        description: "Bestelldatum"
      - name: orderstatus
        description: "Status der Bestellung"
      - name: orderpriority
        description: "Bestellpriorität"
      - name: order_line_count
        description: "Anzahl der Positionen in der Bestellung"
        tests:
          - not_negative
      - name: order_net_amount
        description: "Gesamter Nettobetrag der Bestellung"
        tests:
          - not_negative
      - name: order_discount_amount
        description: "Gesamter Rabattbetrag der Bestellung"
      - name: order_net_amount_incl_tax
        description: "Nettobetrag inkl. Steuer"
      - name: has_late_shipment
        description: "True, wenn mindestens eine Position verspätet versendet wurde"

  - name: fact__order_lines
    description: "Fakten-Tabelle auf Order-Line-Grain. Feinste Granularität mit berechneten KPIs. Materialisiert als Incremental (Merge)."
    columns:
      - name: orderkey
        description: "Fremdschlüssel zur Bestellung"
        tests:
          - not_null
      - name: linenumber
        description: "Positionsnummer"
        tests:
          - not_null
      - name: custkey
        description: "Fremdschlüssel zum Kunden"
      - name: orderdate
        description: "Bestelldatum"
      - name: shipdate
        description: "Versanddatum"
      - name: commitdate
        description: "Zusagedatum"
      - name: receiptdate
        description: "Eingangsdatum"
      - name: quantity
        description: "Bestellmenge"
        tests:
          - not_negative
      - name: extendedprice
        description: "Erweiterter Preis"
        tests:
          - not_negative
      - name: discount
        description: "Rabatt"
      - name: tax
        description: "Steuersatz"
      - name: net_amount
        description: "Nettobetrag der Position (extendedprice * (1 - discount))"
        tests:
          - not_negative
      - name: discount_amount
        description: "Rabattbetrag der Position (extendedprice * discount)"
      - name: net_amount_incl_tax
        description: "Nettobetrag inkl. Steuer"
      - name: is_late_shipment
        description: "True, wenn shipdate > commitdate"
      - name: days_to_ship
        description: "Tage zwischen Bestelldatum und Versanddatum"
      - name: days_to_receive
        description: "Tage zwischen Bestelldatum und Eingangsdatum"
