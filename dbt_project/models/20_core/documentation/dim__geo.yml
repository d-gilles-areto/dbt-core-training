models:
  - name: dim__geo
    description: "Konforme Geografie-Dimension: Nation + Region konsolidiert."
    config:
      tags:
        - "tpch"

    columns:
      - name: nation_id
        description: "Primärschlüssel der Nation"
        data_tests:
          - unique
          - not_null

      - name: nation
        description: "Name des Landes"

      - name: region
        description: "Name der Region"