models:
  - name: dim__customer
    description: '{{ doc("dim__customer__model") }}'
    config:
      tags:
        - "tpch"

    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
        data_tests:
          - unique
          - not_null
        config:
          tags:
            - "pii"

      - name: customer_name
        description: '{{ doc("customer_name") }}'
        config:
          tags:
            - "pii"

      - name: address
        description: "Adresse des Kunden"
        config:
          tags:
            - "pii"

      - name: phone
        description: "Telefonnummer"
        config:
          tags:
            - "pii"

      - name: account_balance
        description: "Kontostand"

      - name: market_segment
        description: "Marktsegment (AUTOMOBILE, BUILDING, etc.)"

      - name: customer_comment
        description: "Kommentar zum Kunden"

      - name: nation_id
        description: '{{ doc("nation_id") }}'